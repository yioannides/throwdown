name: throwdown-release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Major release
          - Point release
          - Bug fix release
        default: Point release

jobs:
  flatpak:
    name: "Flatpak ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: throwdown-${{ matrix.arch }}.flatpak
          manifest-path: io.github.yioannides.Throwdown.json
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: throwdown-${{ matrix.arch }}
          path: throwdown-${{ matrix.arch }}.flatpak

  release:
    name: Create new release
    needs: [flatpak]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Get next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          current=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')

          echo "Current version: $current"

          # If there are no existing releases, start at v1.0.0.
          if [ -z "$current" ]; then
            next="v1.0.0"
          else
            version=${current#v}

            IFS='.' read -r major minor patch <<< "$version"

            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}

            case "$RELEASE_TYPE" in
              "Major release")
                next="v$((major + 1)).0.0"
                ;;

              "Point release")
                next="v${major}.$((minor + 1)).0"
                ;;

              "Bug fix release")
                next="v${major}.${minor}.$((patch + 1))"
                ;;

              *)
                echo "Unknown release type: $RELEASE_TYPE"
                exit 1
                ;;
            esac
          fi

          echo "Next version: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files

          find artifacts \
            -type f \
            -name "*.flatpak" \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files/

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release-files/*.flatpak
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: true
