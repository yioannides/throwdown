name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Major release
          - Point release
          - Bug fix release
        default: Point release

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Create new release
    runs-on: ubuntu-latest

    steps:
      - name: Find latest successful CI run
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow flatpak-ci.yml \
            --branch "${{ github.event.repository.default_branch }}" \
            --status success \
            --limit 1 \
            --json databaseId,headSha,createdAt \
            --jq '.[0]')

          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "No successful Flatpak CI run found."
            exit 1
          fi

          run_id=$(echo "$run" | jq -r '.databaseId')
          sha=$(echo "$run" | jq -r '.headSha')
          created_at=$(echo "$run" | jq -r '.createdAt')

          echo "Using CI run: $run_id"
          echo "Commit: $sha"
          echo "Created: $created_at"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Get next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          current=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          echo "Current release: ${current:-none}"

          if [ -z "$current" ]; then
            next="v1.0.0"
          else
            version=${current#v}

            IFS='.' read -r major minor patch <<< "$version"

            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}

            case "$RELEASE_TYPE" in
              "Major release")
                next="v$((major + 1)).0.0"
                ;;

              "Point release")
                next="v${major}.$((minor + 1)).0"
                ;;

              "Bug fix release")
                next="v${major}.${minor}.$((patch + 1))"
                ;;

              *)
                echo "Unknown release type: $RELEASE_TYPE"
                exit 1
                ;;
            esac
          fi

          echo "Next version: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files

          find artifacts \
            -type f \
            -name "*.flatpak" \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files/

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release-files/*.flatpak
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: true
